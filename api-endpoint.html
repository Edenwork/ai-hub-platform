  <script>
    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', function (e) {
        //e.preventDefault();
        // 移除所有選項的 active 類別和勾勾
        document.querySelectorAll('.dropdown-item').forEach(i => {
          i.classList.remove('active');
          i.querySelector('.checkmark').style.display = 'none';
        });
        // 為當前選項添加 active 類別和顯示勾勾
        this.classList.add('active');
        this.querySelector('.checkmark').style.display = 'inline-block';
        // 更新按鈕文字
        const selectedText = this.querySelector('span').textContent;
        document.querySelector('#modelDropdown').textContent = selectedText;
      });
    });
  </script>

  <!-- 密碼眼睛 -->
  <script>
    document.querySelector('.toggle-password').addEventListener('click', function () {
      const passwordInput = document.querySelector('#password');
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });
  </script>
