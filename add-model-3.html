  <!-- 密碼眼睛 -->
  <script>
    document.querySelector('.toggle-password').addEventListener('click', function () {
      const passwordInput = document.querySelector('#password');
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });
  </script>

  <!-- 在Card 的其他地方也可觸發 radio，並排除點擊下載按鈕 -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // 獲取所有 card-add-model-container 元素
      const containers = document.querySelectorAll('.card-add-model-container');

      containers.forEach(container => {
        container.addEventListener('click', function (event) {
          // 防止點擊 button 或其他特定元素時觸發 radio
          // 如果點擊的是 button 或 radio 本身，則不處理
          // const target = event.target;
          // if (target.closest('.download-btn') || target.closest('.radio-btn'))|| target.closest('.radio-btn')) {
          //     return; 
          // }

          // 如果點擊的是 disabled ，則不處理
          const target = event.target;
          if (target.closest('.disabled')) {
            return;
          }

          // 找到容器內的 radio 按鈕
          const radio = container.querySelector('.radio-btn');
          if (radio) {
            radio.checked = true; // 選中 radio
          }
        });
      });
    });
  </script>
