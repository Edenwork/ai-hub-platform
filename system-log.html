  <style>
    .system-log-snackbar {
      position: fixed;
      left: 140px;/* 40px; */
      bottom: 28px;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 380px;
      max-width: calc(100vw - 80px);
      padding: 26px 28px;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .system-log-snackbar.show {
      opacity: 1;
      transform: translateY(0);
    }

    .system-log-snackbar-icon {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: #139dcc;
      flex: 0 0 auto;
    }

    .download-log-loading {
      align-items: center;
    }

    .download-log-loading:not(.d-none) {
      display: inline-flex;
    }

    @media (max-width: 575.98px) {
      .system-log-snackbar {
        left: 16px;
        right: 16px;
        bottom: 16px;
        min-width: 0;
        max-width: none;
      }
    }
  </style>

  <script>
    const downloadLogBtn = document.getElementById('downloadLogBtn');
    const downloadLogDefault = downloadLogBtn.querySelector('.download-log-default');
    const downloadLogLoading = downloadLogBtn.querySelector('.download-log-loading');
    const systemLogSnackbar = document.getElementById('systemLogSnackbar');
    let systemLogSnackbarTimer;

    function showSystemLogSnackbar() {
      clearTimeout(systemLogSnackbarTimer);
      systemLogSnackbar.classList.add('show');

      systemLogSnackbarTimer = setTimeout(() => {
        systemLogSnackbar.classList.remove('show');
      }, 3000);
    }

    downloadLogBtn.addEventListener('click', () => {
      downloadLogBtn.disabled = true;
      downloadLogDefault.classList.add('d-none');
      downloadLogLoading.classList.remove('d-none');

      setTimeout(() => {
        downloadLogBtn.disabled = false;
        downloadLogDefault.classList.remove('d-none');
        downloadLogLoading.classList.add('d-none');

        showSystemLogSnackbar();
      }, 2000);
    });
  </script>
