<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <title>Sign in</title>
  <link href="./css/bootstrap.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
    <link href="./css/global.css" rel="stylesheet">
  <link href="./css/sign-in.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center py-4 bg-login">

  <main class="form-signin w-100 m-auto">
    <form>
      <div class="signin-bg">
        <div class="text-center">
          <a href="index.html" >
          <img class="mb-4" style="margin-right:auto;margin-left:auto" src="./images/logo/login_logo.png" alt="" width="220"
            height=""></a>
        </div>

        <h3 class="fs-4 mb-3 fw-normal text-dark text-center">歡迎</h1>
        <h4 class="fs-7 mb-5 fw-normal text-dark text-center">登入以繼續使用 FFM Hub</h4>

        <div class="form-floating">
          <input type="email" class="form-control" id="floatingInput" placeholder="">
          <label for="floatingInput">帳號 或 Email*</label>
        </div>
        <div class="form-floating mt-3">
          <input type="password" class="form-control" id="floatingPassword" placeholder="">
          <label for="floatingPassword">密碼*</label>
        </div>

        <!-- <div class="form-check text-start my-3">
          <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
          <label class="form-check-label text-dark" for="flexCheckDefault">
            Remember me
          </label>
        </div> -->

        <div class="fs-7 text-end my-3">
          <label class="text-forgot-pwd">
            <a href="#">忘記密碼</a>
          </label>
        </div>

        <button class="btn btn-login w-100 py-2 fs-6" type="submit">登入</button>
      </div>

      <!-- <p class="mt-3 mb-3 text-body-secondary text-center">&copy; Version: v1.0.0 (2025-05-27 update)</p> -->

    </form>
  </main>
  <script src="./js/bootstrap.bundle.min.js"></script>

</body>

</html>
